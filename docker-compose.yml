services:
  # Desenvolvimento com hot-reload
  dev:
    image: oven/bun:1.2
    working_dir: /app
    volumes:
      - .:/app
      - bun_modules:/app/node_modules
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - VITE_SENNA_BG_URL=/brand/senna-bg.mp4
    command: sh -c "bun install && bun run dev --host 0.0.0.0 --port 3005"
    profiles:
      - dev

  # Backend de dados de F1 (server/) — dev com hot-reload
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./server:/app
      - api_modules:/app/node_modules
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev

  # Produção — constrói a imagem e sobe o servidor SSR
  app:
    build:
      context: .
      target: runner
      args:
        # vazio usa same-origin: o Caddy roteia /api para o backend
        VITE_PITSTOP_API: ${VITE_PITSTOP_API:-}
        # opcional: URL absoluta do vídeo quando ele estiver em uma CDN
        VITE_SENNA_BG_URL: ${VITE_SENNA_BG_URL:-}
    environment:
      - NODE_ENV=production
    expose:
      - "3005" # só na rede interna; quem publica pra internet é o caddy
    profiles:
      - prod

  # Backend de dados de F1 em produção (server/Dockerfile, ícones inclusos)
  api-prod:
    build:
      context: ./server
    expose:
      - "3333" # só na rede interna; o caddy roteia /api/* e /tracks/* pra cá
    environment:
      - NODE_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - CACHE_CLEAR_TOKEN=${CACHE_CLEAR_TOKEN:-}
      - CACHE_MAX_ENTRIES=${CACHE_MAX_ENTRIES:-256}
      - UPSTREAM_TIMEOUT_MS=${UPSTREAM_TIMEOUT_MS:-8000}
      - UPSTREAM_GET_RETRIES=${UPSTREAM_GET_RETRIES:-1}
      - OPENF1_ACCESS_TOKEN=${OPENF1_ACCESS_TOKEN:-}
      - OPENF1_USERNAME=${OPENF1_USERNAME:-}
      - OPENF1_PASSWORD=${OPENF1_PASSWORD:-}
    profiles:
      - prod

  # Reverse proxy + HTTPS automático (Let's Encrypt) na frente de tudo
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - api-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-pitstop.dev.br}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    profiles:
      - prod

volumes:
  bun_modules:
  api_modules:
  caddy_data:
  caddy_config:
