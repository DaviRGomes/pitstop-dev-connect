<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="20" y="20" width="920" height="110" rx="8" fill="#e5f5ec" stroke="#1f8a55" stroke-width="1.5"/><text x="40" y="44" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="start">container</text><rect x="560" y="30" width="365" height="26" rx="5" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5" stroke-dasharray="4 3"/><text x="742" y="48" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="middle">writable layer: gone when the container is removed</text><rect x="20" y="220" width="920" height="170" rx="8" fill="#fafbfc" stroke="#c9d0db" stroke-width="1.5"/><text x="40" y="244" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="start">host</text><rect x="40" y="66" width="260" height="50" rx="6" fill="#ffffff" stroke="#1f8a55" stroke-width="1.5"/><text x="170" y="86" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="middle">named volume</text><text x="170" y="105" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="middle">dados-demo:/dados</text><line x1="170" y1="116" x2="170" y2="252" stroke="#2f6fde" stroke-width="2"/><rect x="40" y="256" width="260" height="76" rx="6" fill="#e6efff" stroke="#2f6fde" stroke-width="1.5"/><text x="170" y="280" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="middle">/var/lib/docker/volumes/</text><text x="170" y="297" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="middle">dados-demo/_data</text><text x="170" y="320" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">Docker manages it</text><rect x="100" y="344" width="140" height="28" rx="14" fill="#e5f5ec" stroke="#1f8a55" stroke-width="1.5"/><text x="170" y="363" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="bold" fill="#1f8a55" text-anchor="middle">persists</text><rect x="350" y="66" width="260" height="50" rx="6" fill="#ffffff" stroke="#1f8a55" stroke-width="1.5"/><text x="480" y="86" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="middle">bind mount</text><text x="480" y="105" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="middle">./site:/usr/share/nginx/html</text><line x1="480" y1="116" x2="480" y2="252" stroke="#2f6fde" stroke-width="2"/><rect x="350" y="256" width="260" height="76" rx="6" fill="#e6efff" stroke="#2f6fde" stroke-width="1.5"/><text x="480" y="280" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="middle">./site</text><text x="480" y="297" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">(host folder)</text><text x="480" y="320" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">you manage it, no isolation</text><rect x="410" y="344" width="140" height="28" rx="14" fill="#e5f5ec" stroke="#1f8a55" stroke-width="1.5"/><text x="480" y="363" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="bold" fill="#1f8a55" text-anchor="middle">persists</text><rect x="660" y="66" width="260" height="50" rx="6" fill="#ffffff" stroke="#1f8a55" stroke-width="1.5"/><text x="790" y="86" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="middle">tmpfs</text><text x="790" y="105" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="middle">--tmpfs /dados</text><line x1="790" y1="116" x2="790" y2="252" stroke="#2f6fde" stroke-width="2" stroke-dasharray="6 4"/><rect x="660" y="256" width="260" height="76" rx="6" fill="#fff3d6" stroke="#e2c27a" stroke-width="1.5"/><text x="790" y="280" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="middle">host memory</text><text x="790" y="320" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">temporary or sensitive data</text><rect x="720" y="344" width="140" height="28" rx="14" fill="#fbe9e9" stroke="#c23b3b" stroke-width="1.5"/><text x="790" y="363" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="bold" fill="#c23b3b" text-anchor="middle">gone on restart</text></svg>
