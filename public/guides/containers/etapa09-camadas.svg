<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs><rect width="960" height="420" fill="#ffffff"/><rect x="20" y="20" width="660" height="380" rx="10" fill="#eef0f4" stroke="#c9d0db" stroke-width="1.5"/><text x="34" y="41" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="bold" fill="#5b6474" text-anchor="start">kernel do host (compartilhado)</text><rect x="42" y="50" width="616" height="328" rx="10" fill="#e6efff" stroke="#2f6fde" stroke-width="1.5"/><text x="56" y="71" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="start">namespaces e cgroups: o que vê e quanto consome</text><rect x="64" y="80" width="572" height="276" rx="10" fill="#dce8ff" stroke="#2f6fde" stroke-width="1.5"/><text x="78" y="101" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="start">AppArmor ou SELinux: controle de acesso obrigatório</text><rect x="86" y="110" width="528" height="224" rx="10" fill="#d2e1ff" stroke="#2f6fde" stroke-width="1.5"/><text x="100" y="131" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="start">seccomp: filtro de chamadas de sistema</text><rect x="108" y="140" width="484" height="172" rx="10" fill="#c8dbff" stroke="#2f6fde" stroke-width="1.5"/><text x="122" y="161" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="start">--cap-drop ALL: capabilities mínimas</text><rect x="130" y="170" width="440" height="120" rx="10" fill="#bed4ff" stroke="#2f6fde" stroke-width="1.5"/><text x="144" y="191" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="start">--read-only + --tmpfs /tmp: disco só leitura</text><rect x="190" y="204" width="320" height="66" rx="8" fill="#ffffff" stroke="#1f8a55" stroke-width="2"/><text x="350" y="231" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">processo da aplicação</text><text x="350" y="253" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1f8a55" text-anchor="middle">USER node (não root)</text><rect x="730" y="150" width="210" height="110" rx="8" fill="#fbe9e9" stroke="#c23b3b" stroke-width="1.5"/><text x="835" y="180" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#c23b3b" text-anchor="middle">docker.sock montado</text><text x="835" y="204" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#c23b3b" text-anchor="middle">/var/run/docker.sock</text><text x="835" y="228" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#c23b3b" text-anchor="middle">atravessa todas as camadas:</text><text x="835" y="246" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#c23b3b" text-anchor="middle">controla o daemon, como root</text><path d="M728,205 C640,205 600,237 512,237" fill="none" stroke="#c23b3b" stroke-width="2" stroke-dasharray="6 4"/></svg>
