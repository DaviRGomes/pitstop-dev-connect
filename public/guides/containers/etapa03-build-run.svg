<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs><rect width="960" height="330" fill="#ffffff"/><text x="300" y="28" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" fill="#2f6fde" text-anchor="middle">docker build: acontece uma vez</text><text x="800" y="28" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" fill="#1f8a55" text-anchor="middle">docker run: acontece a cada container</text><line x1="650" y1="14" x2="650" y2="320" stroke="#d9dde4" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="20" y="50" width="250" height="130" rx="8" fill="#fbfcfd" stroke="#c9d0db" stroke-width="1.5"/><rect x="20" y="50" width="250" height="28" rx="8" fill="#e9ecf1" stroke="#c9d0db" stroke-width="1.5"/><text x="32" y="69" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#1b2230" text-anchor="start">Dockerfile</text><text x="34" y="97" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="start">FROM node:lts-alpine</text><text x="34" y="115" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="start">WORKDIR /app</text><text x="34" y="133" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="start">COPY . /app</text><rect x="26" y="138" width="238" height="18" rx="3" fill="#e6efff" stroke="#e6efff" stroke-width="1.5"/><text x="34" y="151" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="start">RUN npm install</text><text x="34" y="169" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="start">CMD ["node", "index.js"]</text><rect x="20" y="200" width="250" height="40" rx="8" fill="#e9ecf1" stroke="#c9d0db" stroke-width="1.5"/><text x="145" y="225" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" fill="#1b2230" text-anchor="middle">contexto de build (.)</text><text x="145" y="268" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="middle">RUN executa agora e grava uma camada</text><line x1="272" y1="150" x2="348" y2="150" stroke="#9aa3b2" stroke-width="2" marker-end="url(#a)"/><text x="470" y="62" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">imagem</text><rect x="360" y="76" width="220" height="32" rx="5" fill="#e6efff" stroke="#2f6fde" stroke-width="1.5"/><text x="470" y="97" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="middle">RUN npm install</text><rect x="360" y="114" width="220" height="32" rx="5" fill="#f3f5f8" stroke="#c9d0db" stroke-width="1.5"/><text x="470" y="135" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="middle">COPY . /app</text><rect x="360" y="152" width="220" height="32" rx="5" fill="#f3f5f8" stroke="#c9d0db" stroke-width="1.5"/><text x="470" y="173" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="middle">WORKDIR /app</text><rect x="360" y="190" width="220" height="32" rx="5" fill="#f3f5f8" stroke="#c9d0db" stroke-width="1.5"/><text x="470" y="211" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="middle">node:lts-alpine</text><text x="470" y="250" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">CMD: metadado</text><line x1="582" y1="150" x2="688" y2="150" stroke="#9aa3b2" stroke-width="2" marker-end="url(#a)"/><text x="635" y="140" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">run</text><rect x="690" y="70" width="250" height="170" rx="8" fill="#e5f5ec" stroke="#1f8a55" stroke-width="1.5"/><text x="815" y="98" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">container</text><rect x="705" y="112" width="220" height="34" rx="5" fill="#ffffff" stroke="#1f8a55" stroke-width="1.5"/><text x="815" y="134" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#1f8a55" text-anchor="middle">node index.js</text><text x="815" y="172" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">vira o PID 1 do container</text><text x="815" y="192" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">pode ser trocado no docker run</text><text x="815" y="268" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1f8a55" text-anchor="middle">CMD só roda quando o container inicia</text></svg>
