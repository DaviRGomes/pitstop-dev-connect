<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs><rect width="960" height="320" fill="#ffffff"/><rect x="20" y="70" width="220" height="100" rx="8" fill="#fff3d6" stroke="#e2c27a" stroke-width="1.5"/><text x="130.0" y="101.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">starting</text><text x="130.0" y="121.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">start_period: 20s</text><text x="130.0" y="138.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">falhas ainda não contam</text><rect x="380" y="70" width="200" height="100" rx="8" fill="#e5f5ec" stroke="#1f8a55" stroke-width="1.5"/><text x="480.0" y="125.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">healthy</text><rect x="720" y="70" width="220" height="100" rx="8" fill="#fbe9e9" stroke="#c23b3b" stroke-width="1.5"/><text x="830.0" y="125.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">unhealthy</text><line x1="240" y1="120" x2="376" y2="120" stroke="#9aa3b2" stroke-width="2" marker-end="url(#a)"/><text x="308" y="110" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1f8a55" text-anchor="middle">o teste passa</text><path d="M580,100 C640,80 660,80 716,100" fill="none" stroke="#c23b3b" stroke-width="2" marker-end="url(#a)"/><text x="650" y="62" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#c23b3b" text-anchor="middle">3 falhas seguidas (retries: 3)</text><path d="M716,142 C660,162 640,162 584,142" fill="none" stroke="#1f8a55" stroke-width="2" marker-end="url(#a)"/><text x="650" y="182" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1f8a55" text-anchor="middle">o teste volta a passar</text><text x="480" y="28" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" fill="#5b6474" text-anchor="middle">a cada 30s (interval), cada tentativa com até 10s (timeout)</text><rect x="20" y="220" width="920" height="74" rx="8" fill="#e9ecf1" stroke="#c9d0db" stroke-width="1.5"/><text x="480" y="250" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="middle">o healthcheck só classifica; quem reage é o runtime ou o orquestrador</text><text x="480" y="274" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">restart, depends_on: condition: service_healthy, docker compose up --wait</text></svg>
