, monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">redis</text><text x="455.0" y="92.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">cache, EX 30 s</text><rect x="360" y="300" width="190" height="80" rx="8" fill="#f0eafc" stroke="#7c4dcc" stroke-width="1.5"/><text x="455.0" y="332.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">replica</text><text x="455.0" y="352.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">read only</text><rect x="720" y="170" width="190" height="80" rx="8" fill="#f0eafc" stroke="#7c4dcc" stroke-width="1.5"/><text x="815.0" y="202.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">primary</text><text x="815.0" y="222.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">receives the writes</text><line x1="200" y1="180" x2="360" y2="90" stroke="#c27c0e" stroke-width="2" marker-end="url(#a-amber)"/><text x="235" y="105.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#c27c0e" text-anchor="middle">1. GET produto:1</text><line x1="200" y1="240" x2="360" y2="340" stroke="#7c4dcc" stroke-width="2" marker-end="url(#a-violet)"/><text x="235" y="335.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#7c4dcc" text-anchor="middle">2. on MISS: SELECT</text><line x1="200" y1="210" x2="720" y2="210" stroke="#7c4dcc" stroke-width="2" marker-end="url(#a-violet)"/><text x="460" y="196.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#7c4dcc" text-anchor="middle">write: INSERT, UPDATE</text><line x1="760" y1="250" x2="550" y2="340" stroke="#7c4dcc" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-violet)"/><text x="700" y="327.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#7c4dcc" text-anchor="middle">asynchronous replication</text><text x="700" y="342.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#7c4dcc" text-anchor="middle">(streaming)</text><text x="480" y="415.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">3. the application stores the value in redis with EX 30 and returns it; a HIT answers straight from the cache</text></svg>