<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c27c0e"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c4dcc"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d0db"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="20" y="20" width="920" height="360" rx="8" fill="#fafbfc" stroke="#c9d0db" stroke-width="1.5"/><text x="38" y="44.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="start">Produtor, fila e workers</text><rect x="40" y="130" width="110" height="100" rx="8" fill="#fafbfc" stroke="#c9d0db" stroke-width="1.5"/><text x="95.0" y="172.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">cliente</text><text x="95.0" y="192.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">curl</text><rect x="250" y="130" width="150" height="100" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="1.5"/><text x="325.0" y="164.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">app</text><text x="325.0" y="191.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">API (produtor)</text><text x="325.0" y="206.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">3 réplicas</text><rect x="500" y="130" width="150" height="100" rx="8" fill="#fff4e0" stroke="#c27c0e" stroke-width="1.5"/><text x="575.0" y="172.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">redis</text><text x="575.0" y="192.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">fila de pedidos</text><rect x="750" y="130" width="170" height="100" rx="8" fill="#fafbfc" stroke="#c9d0db" stroke-width="1.5"/><text x="835.0" y="164.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">worker</text><text x="835.0" y="191.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">1 s por pedido</text><text x="835.0" y="206.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">escala à parte</text><line x1="150" y1="165" x2="250" y2="165" stroke="#2f6fde" stroke-width="2" marker-end="url(#a-blue)"/><text x="200" y="150.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="middle">POST /pedido</text><line x1="250" y1="205" x2="150" y2="205" stroke="#1f9d55" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-green)"/><text x="200" y="225.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1f9d55" text-anchor="middle">202 recebido</text><line x1="400" y1="180" x2="500" y2="180" stroke="#c27c0e" stroke-width="2" marker-end="url(#a-amber)"/><text x="450.0" y="170.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#c27c0e" text-anchor="middle">enfileira</text><line x1="650" y1="180" x2="750" y2="180" stroke="#c27c0e" stroke-width="2" marker-end="url(#a-amber)"/><text x="700.0" y="170.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#c27c0e" text-anchor="middle">consome</text><text x="480" y="310.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" fill="#5b6474" text-anchor="middle">12 pedidos de 1 s: perto de 12 s com 1 worker, perto de 4 s com 3 workers</text><text x="480" y="335.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">a resposta 202 sai na hora; o trabalho pesado acontece depois</text></svg>