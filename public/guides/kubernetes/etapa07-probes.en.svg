<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs><rect width="960" height="340" fill="#ffffff"/><text x="480" y="28" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">the kubelet runs the probes of the exemplo-probes Pod</text><rect x="20" y="46" width="300" height="140" rx="8" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/><text x="170" y="74" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">livenessProbe</text><text x="170" y="96" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" fill="#1b2230" text-anchor="middle">is it alive?</text><text x="170" y="124" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">httpGet /health</text><text x="170" y="143" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">periodSeconds: 10</text><text x="170" y="162" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">failureThreshold: 3</text><line x1="170" y1="186" x2="170" y2="214" stroke="#c23b3b" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="218" width="300" height="62" rx="8" fill="#fbe9e9" stroke="#c23b3b" stroke-width="1.5"/><text x="170" y="244" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#c23b3b" text-anchor="middle">failed: the kubelet restarts</text><text x="170" y="264" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#c23b3b" text-anchor="middle">the container (same Pod)</text><rect x="330" y="46" width="300" height="140" rx="8" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/><text x="480" y="74" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">readinessProbe</text><text x="480" y="96" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" fill="#1b2230" text-anchor="middle">is it ready?</text><text x="480" y="124" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">httpGet /ready</text><text x="480" y="143" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">periodSeconds: 5</text><line x1="480" y1="186" x2="480" y2="214" stroke="#e2c27a" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="218" width="300" height="62" rx="8" fill="#fff3d6" stroke="#e2c27a" stroke-width="1.5"/><text x="480" y="244" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#6b5310" text-anchor="middle">failed: the Pod leaves the Service</text><text x="480" y="264" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#6b5310" text-anchor="middle">without a restart</text><rect x="640" y="46" width="300" height="140" rx="8" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/><text x="790" y="74" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">startupProbe</text><text x="790" y="96" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" fill="#1b2230" text-anchor="middle">has it finished starting?</text><text x="790" y="124" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">httpGet /startup</text><text x="790" y="143" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">periodSeconds: 30</text><line x1="790" y1="186" x2="790" y2="214" stroke="#2f6fde" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="218" width="300" height="62" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="1.5"/><text x="790" y="244" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#2f6fde" text-anchor="middle">until it passes, it holds</text><text x="790" y="264" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="middle">liveness and readiness</text><text x="480" y="318" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">with no probe, the kubelet only restarts the container when the process exits (restartPolicy: Always)</text></svg>
