<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs><rect width="960" height="400" fill="#ffffff"/><rect x="20" y="40" width="230" height="110" rx="8" fill="#1b2230" stroke="#1b2230" stroke-width="1.5"/><text x="36" y="64" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#9aa3b2" text-anchor="start">terminal</text><text x="36" y="96" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="normal" fill="#e6efff" text-anchor="start">$ kubectl get pods</text><text x="36" y="126" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#9aa3b2" text-anchor="start">-v=6 mostra a requisição HTTP</text><line x1="135" y1="150" x2="135" y2="196" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><text x="150" y="178" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="start">lê</text><rect x="30" y="200" width="210" height="84" rx="8" fill="#fff3d6" stroke="#e2c27a" stroke-width="1.5"/><text x="135" y="226" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">kubeconfig</text><text x="135" y="248" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">endereço do API Server</text><text x="135" y="268" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">credenciais e contexto</text><line x1="250" y1="95" x2="556" y2="95" stroke="#2f6fde" stroke-width="2" marker-end="url(#a)"/><text x="403" y="82" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="middle">GET /api/v1/namespaces/default/pods</text><line x1="556" y1="125" x2="254" y2="125" stroke="#1f8a55" stroke-width="2" marker-end="url(#a)"/><text x="403" y="145" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="normal" fill="#1f8a55" text-anchor="middle">a resposta volta em JSON; o kubectl formata</text><rect x="560" y="20" width="380" height="150" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="1.5" stroke-dasharray="6 4"/><text x="580" y="44" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#2f6fde" text-anchor="start">control plane</text><rect x="580" y="60" width="170" height="90" rx="8" fill="#ffffff" stroke="#2f6fde" stroke-width="2"/><text x="665" y="100" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">API Server</text><text x="665" y="122" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">REST</text><rect x="790" y="60" width="130" height="90" rx="8" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/><text x="855" y="100" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">etcd</text><text x="855" y="122" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="middle">estado do cluster</text><line x1="750" y1="105" x2="786" y2="105" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><line x1="20" y1="310" x2="940" y2="310" stroke="#e3e6ec" stroke-width="1.6"/><text x="20" y="338" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="start">imperativo</text><text x="20" y="362" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="start">kubectl run nginx --image=nginx</text><text x="20" y="384" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="start">ordem direta: bom para testes</text><text x="490" y="338" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="start">declarativo</text><text x="490" y="362" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="start">kubectl apply -f arquivo.yaml</text><text x="490" y="384" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="start">estado desejado num arquivo versionado</text></svg>
