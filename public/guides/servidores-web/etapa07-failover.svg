<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs><rect width="960" height="460" fill="#ffffff"/><rect x="20" y="120" width="110" height="56" rx="8" fill="#e9ecf1" stroke="#c9d0db" stroke-width="1.5"/><text x="75" y="153" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="normal" fill="#1b2230" text-anchor="middle">cliente</text><line x1="130" y1="148" x2="218" y2="148" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><rect x="220" y="100" width="190" height="96" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="1.5"/><text x="315" y="138" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="bold" fill="#1b2230" text-anchor="middle">Nginx</text><text x="315" y="162" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="middle">upstream pitstop_api</text><rect x="560" y="30" width="150" height="52" rx="8" fill="#fbe9e9" stroke="#c23b3b" stroke-width="1.5"/><text x="635" y="62" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">api-1</text><rect x="560" y="122" width="150" height="52" rx="8" fill="#e5f5ec" stroke="#1f8a55" stroke-width="1.5"/><text x="635" y="154" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">api-2</text><rect x="560" y="214" width="150" height="52" rx="8" fill="#f3f5f8" stroke="#c9d0db" stroke-width="1.5" stroke-dasharray="6 4"/><text x="635" y="246" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">api-backup</text><path d="M410,120 C470,120 490,56 556,56" fill="none" stroke="#c23b3b" stroke-width="1.6"/><line x1="521" y1="51" x2="539" y2="69" stroke="#c23b3b" stroke-width="3"/><line x1="521" y1="69" x2="539" y2="51" stroke="#c23b3b" stroke-width="3"/><text x="220" y="50" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#c23b3b" text-anchor="start">a conexão com api-1 falha:</text><text x="220" y="70" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="start">proxy_next_upstream tenta o próximo</text><text x="726" y="52" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#c23b3b" text-anchor="start">3 falhas em 10 s:</text><text x="726" y="70" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#c23b3b" text-anchor="start">fora da rotação por 10 s</text><line x1="410" y1="148" x2="556" y2="148" stroke="#1f8a55" stroke-width="1.6" marker-end="url(#a)"/><text x="726" y="153" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1f8a55" text-anchor="start">responde 200</text><path d="M410,176 C470,176 490,240 556,240" fill="none" stroke="#9aa3b2" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="726" y="236" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="start">backup: só entra se</text><text x="726" y="254" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="start">api-1 e api-2 caírem</text><line x1="20" y1="298" x2="940" y2="298" stroke="#e3e6ec" stroke-width="1.6"/><rect x="20" y="316" width="70" height="36" rx="8" fill="#e9ecf1" stroke="#c9d0db" stroke-width="1.5"/><text x="55" y="339" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" fill="#1b2230" text-anchor="middle">Nginx</text><rect x="230" y="316" width="90" height="36" rx="8" fill="#f3f5f8" stroke="#c9d0db" stroke-width="1.5"/><text x="275" y="339" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" fill="#1b2230" text-anchor="middle">backend</text><line x1="90" y1="334" x2="200" y2="334" stroke="#c23b3b" stroke-width="1.6"/><line x1="203" y1="327" x2="217" y2="341" stroke="#c23b3b" stroke-width="3"/><line x1="203" y1="341" x2="217" y2="327" stroke="#c23b3b" stroke-width="3"/><text x="380" y="330" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" fill="#c23b3b" text-anchor="start">502 Bad Gateway</text><text x="380" y="350" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="start">o Nginx não obteve resposta válida: conexão recusada, encerrada ou resposta inválida</text><rect x="20" y="382" width="70" height="36" rx="8" fill="#e9ecf1" stroke="#c9d0db" stroke-width="1.5"/><text x="55" y="405" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" fill="#1b2230" text-anchor="middle">Nginx</text><rect x="230" y="382" width="90" height="36" rx="8" fill="#f3f5f8" stroke="#c9d0db" stroke-width="1.5"/><text x="275" y="405" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" fill="#1b2230" text-anchor="middle">backend</text><line x1="90" y1="394" x2="228" y2="394" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><text x="160" y="414" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">esperando…</text><circle cx="345" cy="400" r="11" fill="#ffffff" stroke="#c23b3b" stroke-width="1.5"/><line x1="345" y1="400" x2="345" y2="393" stroke="#c23b3b" stroke-width="2"/><line x1="345" y1="400" x2="351" y2="403" stroke="#c23b3b" stroke-width="2"/><text x="380" y="396" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" fill="#c23b3b" text-anchor="start">504 Gateway Timeout</text><text x="380" y="416" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="start">a conexão abriu, mas o backend não respondeu dentro do proxy_read_timeout</text></svg>
