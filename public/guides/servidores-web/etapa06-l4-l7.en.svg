<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs><rect width="960" height="370" fill="#ffffff"/><rect x="15" y="10" width="455" height="350" rx="12" fill="#fafbfc" stroke="#e3e6ec" stroke-width="1.5"/><text x="242" y="40" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="bold" fill="#1b2230" text-anchor="middle">L7: Nginx on port 8080</text><text x="242" y="60" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">reads HTTP: method, Host, path</text><rect x="35" y="140" width="90" height="44" rx="8" fill="#e9ecf1" stroke="#c9d0db" stroke-width="1.5"/><text x="80" y="167" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="normal" fill="#1b2230" text-anchor="middle">client</text><rect x="175" y="120" width="120" height="84" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="1.5"/><text x="235" y="158" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="bold" fill="#1b2230" text-anchor="middle">Nginx</text><text x="235" y="180" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="middle">http</text><line x1="125" y1="150" x2="173" y2="140" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><line x1="125" y1="174" x2="173" y2="184" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><text x="149" y="124" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="middle">GET /</text><text x="149" y="208" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="middle">GET /api/</text><rect x="325" y="94" width="130" height="50" rx="8" fill="#e5f5ec" stroke="#1f8a55" stroke-width="1.5"/><text x="390" y="114" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="normal" fill="#1f8a55" text-anchor="middle">answers by itself:</text><text x="390" y="132" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="normal" fill="#1f8a55" text-anchor="middle">Nginx's own home page</text><path d="M295,140 C310,140 310,119 321,119" fill="none" stroke="#1f8a55" stroke-width="1.6" marker-end="url(#a)"/><text x="390" y="86" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="middle">location = /</text><text x="390" y="214" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="middle">location /api/</text><rect x="335" y="222" width="110" height="44" rx="8" fill="#f3f5f8" stroke="#c9d0db" stroke-width="1.5"/><text x="390" y="249" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">api-1</text><path d="M295,184 C315,184 315,244 331,244" fill="none" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><rect x="335" y="284" width="110" height="44" rx="8" fill="#f3f5f8" stroke="#c9d0db" stroke-width="1.5"/><text x="390" y="311" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">api-2</text><path d="M295,184 C315,184 315,306 331,306" fill="none" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><text x="242" y="346" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">Round Robin between api-1 and api-2</text><rect x="490" y="10" width="455" height="350" rx="12" fill="#fafbfc" stroke="#e3e6ec" stroke-width="1.5"/><text x="717" y="40" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="bold" fill="#1b2230" text-anchor="middle">L4: Nginx stream on port 9090</text><text x="717" y="60" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">sees only IP and port; relays the TCP connection</text><rect x="510" y="140" width="90" height="44" rx="8" fill="#e9ecf1" stroke="#c9d0db" stroke-width="1.5"/><text x="555" y="167" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="normal" fill="#1b2230" text-anchor="middle">client</text><rect x="650" y="120" width="120" height="84" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="1.5"/><text x="710" y="158" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="bold" fill="#1b2230" text-anchor="middle">Nginx</text><text x="710" y="180" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#2f6fde" text-anchor="middle">stream</text><line x1="600" y1="162" x2="648" y2="162" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><text x="624" y="150" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#5b6474" text-anchor="middle">TCP</text><text x="717" y="344" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">"/" also reaches a backend</text><rect x="810" y="110" width="110" height="44" rx="8" fill="#f3f5f8" stroke="#c9d0db" stroke-width="1.5"/><text x="865" y="137" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">api-1</text><path d="M770,162 C790,162 790,132 806,132" fill="none" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><rect x="810" y="210" width="110" height="44" rx="8" fill="#f3f5f8" stroke="#c9d0db" stroke-width="1.5"/><text x="865" y="237" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle">api-2</text><path d="M770,162 C790,162 790,232 806,232" fill="none" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#a)"/><text x="717" y="322" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">each TCP connection goes to a backend</text></svg>
