xt-anchor="middle">control node</text><text x="540" y="104" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#5b6474" text-anchor="middle">no taint</text><rect x="690" y="30" width="250" height="270" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="2"/><text x="815" y="58" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#1b2230" text-anchor="middle">lab-m02</text><rect x="705" y="72" width="220" height="28" rx="6" fill="#fbe9e9" stroke="#c23b3b" stroke-width="1.5"/><text x="815" y="91" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#c23b3b" text-anchor="middle">taint dedicated=ml:NoSchedule</text><rect x="705" y="108" width="220" height="28" rx="6" fill="#e5f5ec" stroke="#1f8a55" stroke-width="1.5"/><text x="815" y="127" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#1f8a55" text-anchor="middle">label disk=ssd</text><rect x="730" y="170" width="170" height="56" rx="8" fill="#ffffff" stroke="#1f8a55" stroke-width="2"/><text x="815" y="194" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#1b2230" text-anchor="middle">com-toleration</text><text x="815" y="214" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#1f8a55" text-anchor="middle">Running</text><path d="M310,85 C370,85 370,198 430,198 L726,198" fill="none" stroke="#1f8a55" stroke-width="2" marker-end="url(#a)"/><text x="575" y="188" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1f8a55" text-anchor="middle">Running on lab-m02</text><path d="M310,245 C500,245 560,262 684,262" fill="none" stroke="#c23b3b" stroke-width="2" stroke-dasharray="6 4"/><line x1="679" y1="253" x2="697" y2="271" stroke="#c23b3b" stroke-width="3"/><line x1="679" y1="271" x2="697" y2="253" stroke="#c23b3b" stroke-width="3"/><text x="500" y="288" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#c23b3b" text-anchor="middle">the taint repels it</text><rect x="90" y="310" width="150" height="30" rx="15" fill="#fbe9e9" stroke="#c23b3b" stroke-width="1.5"/><text x="165" y="330" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="bold" fill="#c23b3b" text-anchor="middle">stays Pending</text><rect x="20" y="354" width="920" height="36" rx="8" fill="#e9ecf1" stroke="#c9d0db" stroke-width="1.5"/><text x="480" y="377" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#1b2230" text-anchor="middle">the toleration lets it in and the affinity picks the node: together, only the ML Pod gets in, and it stays there</text></svg>
